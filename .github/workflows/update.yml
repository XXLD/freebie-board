name: Refresh freebies
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - extra.json
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit changes
        run: |
          git config user.name "freebie-bot"
          git config user.email "freebie-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Refresh freebies"
          git push
